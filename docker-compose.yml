services:
  mysql:
    image: mysql:8.0
    container_name: skillforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ai_learning_platform
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillforge-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # PHP API (php-backend/). The NestJS version is in backend/.
  backend:
    build:
      context: ./php-backend
      dockerfile: Dockerfile
    container_name: skillforge-backend
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    environment:
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "password"
      DB_NAME: "ai_learning_platform"
      JWT_SECRET: "dev-secret-change-me-in-production"
      # Signs image links in content. Use the Hostinger value (root .env) so
      # content copied between local and Hostinger keeps working images.
      ATTACHMENT_SECRET: "${ATTACHMENT_SECRET:-dev-secret-change-me-in-production}"
      FRONTEND_URL: "http://${PUBLIC_HOST:-localhost}:${FRONTEND_HOST_PORT:-3000}"
      CORS_ORIGINS: "http://localhost:${FRONTEND_HOST_PORT:-3000},http://${PUBLIC_HOST:-localhost}:${FRONTEND_HOST_PORT:-3000}"
      UPLOAD_DIR: "/app/uploads"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Kolkata}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://${PUBLIC_HOST:-localhost}:${BACKEND_HOST_PORT:-3001}"
        API_INTERNAL_URL: "http://backend:3001"
    container_name: skillforge-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://${PUBLIC_HOST:-localhost}:${BACKEND_HOST_PORT:-3001}"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  uploads_data:
